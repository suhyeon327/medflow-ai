spring:
  application:
    name: medflow-ai

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL}

ai:
  provider: ${AI_PROVIDER}

jwt:
  secret: ${JWT_SECRET}

admin:
  bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}